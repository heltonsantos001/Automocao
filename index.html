<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formato Cartão</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            background-color: rgb(58, 56, 56);
        }
        #content{
          margin: auto;
          max-width: 700px;
          display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
        }
        #content h1{
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        color: #fff;
        }
        #textArea, #result {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 14px;
        }
        button {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px ;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #message {
            color: green;
        }
    </style>
</head>
<body>
  <div id="content">
    <h1>Formatar Dados de Cartão</h1>
    <textarea id="textArea" placeholder="Cole os dados dos cartões aqui..."></textarea><br>
    <button id="ativar">Formatar</button><br>
    <textarea id="result" readonly placeholder="Texto formatado aparecerá aqui..."></textarea><br>
    <button onclick="copyText()">Copiar para a área de transferência</button>
    <p id="message"></p>
  </div>
   

    <script>
        const ativar = document.getElementById('ativar');
        const textArea = document.getElementById('textArea');
        const result = document.getElementById('result');

        // Função para formatar o texto
        const formatCardData = (text) => {
            const regex = /(\d{16})\s*(\d{2})\s*\/\s*(\d{4})(\d{3})/g;
            const matches = [];
            
            let match;
            while ((match = regex.exec(text)) !== null) {
                matches.push(`${match[1]}|${match[2]}|${match[3]}|${match[4]}`);
            }

            return matches.join("\n");
        };

        // Função para copiar o texto para a área de transferência
        function copyText() {
            result.select();
            result.setSelectionRange(0, 99999); // Para dispositivos móveis

            try {
                document.execCommand('copy');
                document.getElementById('message').textContent = 'Texto copiado com sucesso!';
            } catch (err) {
                document.getElementById('message').textContent = 'Falha ao copiar o texto.';
            }
        }

        // Evento de click no botão de formatação
        ativar.addEventListener('click', () => {
            const formattedText = formatCardData(textArea.value);
            result.value = formattedText;
        });
    </script>
</body>
</html>
